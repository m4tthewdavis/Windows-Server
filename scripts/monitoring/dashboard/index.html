<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Health</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2330; --muted:#6b7385; --line:#e3e6ec; --ok:#1a9d5c; --warn:#d98a00; --bad:#d93a3a; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b2029; --fg:#e6e9f0; --muted:#8c95a8; --line:#2b3240; --accent:#6c9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,Segoe UI,sans-serif; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; } .muted { color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
  .big { font-size:32px; font-weight:600; }
  svg { width:100%; height:90px; display:block; margin-top:8px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:4px 0 12px; }
  .bar > i { display:block; height:100%; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  ul { list-style:none; margin:0; padding:0; } li { padding:6px 0; border-top:1px solid var(--line); } li:first-child { border-top:0; }
  #err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1 id="host">Server Health</h1>
  <div class="muted"><span id="os"></span> · up <span id="uptime">–</span> · <span id="updated">connecting…</span> <span id="err"></span></div>
</header>
<div class="grid">
  <section class="card"><h2>CPU</h2><div class="big" id="cpu">–</div><svg id="cpuChart" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></section>
  <section class="card"><h2>Memory</h2><div class="big" id="mem">–</div><div class="muted" id="memDetail"></div><svg id="memChart" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></section>
  <section class="card"><h2>Disks</h2><div id="disks"></div></section>
  <section class="card"><h2>Services</h2><ul id="services"></ul></section>
</div>
<script>
const $ = id => document.getElementById(id);
const color = p => p >= 90 ? 'var(--bad)' : p >= 75 ? 'var(--warn)' : 'var(--ok)';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
}
function chart(svg, values) {
  const n = values.length, step = n > 1 ? 300 / (n - 1) : 0;
  const pts = values.map((v, i) => (i * step).toFixed(1) + ',' + (88 - Math.min(100, v) * 0.86).toFixed(1));
  svg.innerHTML = '<polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="' + pts.join(' ') + '"/>';
}
function render(data) {
  const c = data.current;
  document.title = c.host + ' – Server Health';
  $('host').textContent = c.host;
  $('os').textContent = c.os;
  $('uptime').textContent = fmtUptime(c.uptimeSec);
  $('updated').textContent = 'updated ' + new Date(c.time).toLocaleTimeString();
  $('cpu').textContent = c.cpuPct + '%';
  $('cpu').style.color = color(c.cpuPct);
  $('mem').textContent = c.memory.usedPct + '%';
  $('mem').style.color = color(c.memory.usedPct);
  $('memDetail').textContent = (c.memory.usedMB / 1024).toFixed(1) + ' / ' + (c.memory.totalMB / 1024).toFixed(1) + ' GB used';
  chart($('cpuChart'), data.history.map(h => h.cpuPct));
  chart($('memChart'), data.history.map(h => h.memory.usedPct));
  $('disks').innerHTML = c.disks.map(d =>
    '<div class="row"><b>' + esc(d.drive) + ' ' + esc(d.label || '') + '</b><span class="muted">' + d.freeGB + ' GB free of ' + d.sizeGB + ' GB</span></div>' +
    '<div class="bar"><i style="width:' + d.usedPct + '%;background:' + color(d.usedPct) + '"></i></div>').join('') || '<span class="muted">No fixed disks</span>';
  $('services').innerHTML = c.services.map(s =>
    '<li class="row"><span><span class="dot" style="background:' + (s.ok ? 'var(--ok)' : 'var(--bad)') + '"></span>' + esc(s.display) + '</span><span class="muted">' + esc(s.status) + '</span></li>').join('');
}
async function tick() {
  try {
    const r = await fetch('/api/metrics', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    $('err').textContent = '';
  } catch (e) { $('err').textContent = '· ' + e.message; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
